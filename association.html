<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الجمعيات - وصْل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header { padding: 120px 0 40px; background: var(--bg); text-align: center; border-bottom: 1px solid var(--border); }
        .page-header h1 { font-size: 2.5rem; color: var(--text); margin-bottom: 10px; }
        .page-header p { color: var(--text-muted); font-size: 1.1rem; }
        .form-container { max-width: 800px; margin: 0 auto; padding: 60px 0; }
        .form-section { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; }
        .form-section h3 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: var(--text); }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 1rem; transition: 0.3s; background: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .submit-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: 0.3s; font-family: 'Cairo', sans-serif; }
        .submit-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .success-msg { background: #dcfce7; color: #166534; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; display: none; align-items: center; gap: 10px; font-weight: 700; }
        .success-msg.show { display: flex; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="index.html" class="logo"><img src="assets/logo.png" alt="وصْل"><span>وصْل</span></a>
        <nav class="main-nav">
            <a href="index.html">الرئيسية</a>
            <a href="needy.html">طلب مساعدة</a>
            <a href="volunteer.html">المتطوعين</a>
            <a href="donor.html">المتبرعين</a>
            <a href="admin.html">لوحة التحكم</a>
        </nav>
        <button class="menu-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1><i class="fa-solid fa-building-ngo"></i> بوابة الجمعيات</h1>
        <p>سجّل جمعيتك وانشر احتياجاتك أو مواردك الفائضة للمطابقة الذكية</p>
    </div>
</section>

<section class="form-container">
    <div class="container">
        <div class="success-msg" id="successMsg">
            <i class="fa-solid fa-check-circle"></i> تم نشر الطلب بنجاح! سيتم مراجعته من قبل الإدارة.
        </div>

        <form id="assocForm">
            <div class="form-section">
                <h3><i class="fa-solid fa-building"></i> بيانات الجمعية</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>اسم الجمعية <span class="required">*</span></label>
                        <input type="text" id="assocName" required placeholder="مثال: جمعية النور الخيرية">
                    </div>
                    <div class="form-group">
                        <label>رقم التسجيل الرسمي</label>
                        <input type="text" id="assocRegNum" placeholder="رقم السجل أو الترخيص">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>الولاية <span class="required">*</span></label>
                        <select id="assocState" required>
                            <option value="">اختر الولاية...</option>
                            <option value="المدية">المدية (Pilot Project)</option>
                            <option value="الجزائر">الجزائر العاصمة</option>
                            <option value="وهران">وهران</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>البلدية <span class="required">*</span></label>
                        <input type="text" id="assocCity" required placeholder="اسم البلدية">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>البريد الإلكتروني <span class="required">*</span></label>
                        <input type="email" id="assocEmail" required placeholder="contact@assoc.dz">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف <span class="required">*</span></label>
                        <input type="tel" id="assocPhone" required placeholder="0550 00 00 00">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3><i class="fa-solid fa-bullhorn"></i> نوع النشر</h3>
                <div class="form-group">
                    <label>ماذا تريد أن تنشر؟ <span class="required">*</span></label>
                    <select id="publishType" required onchange="togglePublishFields()">
                        <option value="">اختر النوع...</option>
                        <option value="need">احتياج مساعدة (نبحث عن دعم)</option>
                        <option value="surplus">فائض موارد (نريد التبرع به)</option>
                        <option value="volunteers">نحتاج متطوعين</option>
                    </select>
                </div>

                <div id="needFields" style="display:none;">
                    <div class="form-group">
                        <label>نوع الاحتياج <span class="required">*</span></label>
                        <select id="needType">
                            <option value="food">مساعدات غذائية</option>
                            <option value="medical">مساعدات طبية / أدوية</option>
                            <option value="clothing">كسوة وملابس</option>
                            <option value="housing">مساعدة في السكن</option>
                            <option value="education">مساعدات تعليمية</option>
                            <option value="financial">مساعدة مالية طارئة</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>عدد المستفيدين المتوقع</label>
                        <input type="number" id="needBeneficiaries" placeholder="مثال: 50">
                    </div>
                </div>

                <div id="surplusFields" style="display:none;">
                    <div class="form-group">
                        <label>نوع الفائض <span class="required">*</span></label>
                        <select id="surplusType">
                            <option value="food">مواد غذائية</option>
                            <option value="clothing">ملابس</option>
                            <option value="medical">أدوية ومعدات طبية</option>
                            <option value="equipment">معدات وأثاث</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الكمية التقريبية</label>
                        <input type="text" id="surplusQuantity" placeholder="مثال: 100 سلة غذائية">
                    </div>
                </div>

                <div id="volunteerFields" style="display:none;">
                    <div class="form-group">
                        <label>نوع التطوع المطلوب <span class="required">*</span></label>
                        <select id="volunteerType">
                            <option value="distribution">توزيع مساعدات</option>
                            <option value="events">تنظيم فعاليات</option>
                            <option value="medical">مساعدة طبية</option>
                            <option value="admin">دعم إداري</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>عدد المتطوعين المطلوب</label>
                        <input type="number" id="volunteerCount" placeholder="مثال: 10">
                    </div>
                    <div class="form-group">
                        <label>تاريخ الفعالية (إن وجد)</label>
                        <input type="date" id="eventDate">
                    </div>
                </div>

                <div class="form-group">
                    <label>تفاصيل إضافية</label>
                    <textarea id="publishDetails" rows="4" placeholder="اشرح احتياجك أو مواردك بتفصيل أكثر..."></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fa-solid fa-paper-plane"></i> نشر في الشبكة
            </button>
        </form>
    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom"><p>&copy; <span id="current-year"></span> منصة وصْل - جميع الحقوق محفوظة.</p></div>
    </div>
</footer>

<script type="module">
    import { db, ref, push, serverTimestamp } from './firebase.js';

    function togglePublishFields() {
        const type = document.getElementById('publishType').value;
        document.getElementById('needFields').style.display = type === 'need' ? 'block' : 'none';
        document.getElementById('surplusFields').style.display = type === 'surplus' ? 'block' : 'none';
        document.getElementById('volunteerFields').style.display = type === 'volunteers' ? 'block' : 'none';
    }

    document.getElementById('current-year').textContent = new Date().getFullYear();

    document.getElementById('assocForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

        const data = {
            type: 'association',
            name: document.getElementById('assocName').value,
            regNum: document.getElementById('assocRegNum').value,
            state: document.getElementById('assocState').value,
            city: document.getElementById('assocCity').value,
            email: document.getElementById('assocEmail').value,
            phone: document.getElementById('assocPhone').value,
            publishType: document.getElementById('publishType').value,
            needType: document.getElementById('needType').value,
            needBeneficiaries: document.getElementById('needBeneficiaries').value,
            surplusType: document.getElementById('surplusType').value,
            surplusQuantity: document.getElementById('surplusQuantity').value,
            volunteerType: document.getElementById('volunteerType').value,
            volunteerCount: document.getElementById('volunteerCount').value,
            eventDate: document.getElementById('eventDate').value,
            details: document.getElementById('publishDetails').value,
            status: 'pending_review',
            timestamp: serverTimestamp()
        };

        try {
            await push(ref(db, 'requests/associations'), data);
            document.getElementById('successMsg').classList.add('show');
            this.reset();
            togglePublishFields();
            setTimeout(() => document.getElementById('successMsg').classList.remove('show'), 4000);
        } catch (error) {
            console.error("Error:", error);
            alert('حدث خطأ أثناء النشر، يرجى المحاولة لاحقاً.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> نشر في الشبكة';
        }
    });

    const menuToggle = document.querySelector('.menu-toggle');
    const mainNav = document.querySelector('.main-nav');
    if (menuToggle && mainNav) {
        menuToggle.addEventListener('click', () => {
            mainNav.style.display = mainNav.style.display === 'flex' ? 'none' : 'flex';
        });
    }
</script>
</body>
</html>
